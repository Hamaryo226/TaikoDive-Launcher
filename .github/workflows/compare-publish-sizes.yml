name: Inspect R2 pagination contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read multipart response shapes (no writes)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir inventory
          aws --version
          aws s3api list-multipart-uploads --bucket taikodive --prefix launcher/ --endpoint-url "$endpoint" --output json > inventory/multipart-auto.json
          aws s3api list-multipart-uploads --bucket taikodive --prefix launcher/ --endpoint-url "$endpoint" --output json --no-paginate > inventory/multipart-page.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-pagination-contract
          path: inventory/
          retention-days: 3
