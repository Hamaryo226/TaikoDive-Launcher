name: Verify reviewed R2 manager on live read-only inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c9cbd0193815eb475b7442c93b6c53126c6f082b
          persist-credentials: false
          sparse-checkout: tools/r2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test on Ubuntu
        run: python -m unittest discover -s tools/r2 -p 'test_*.py' -v
      - name: Dry-run all three channels (no remote writes)
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          New-Item -ItemType Directory inventory | Out-Null
          foreach ($channel in @('launcher', 'game', 'assets')) {
            & ./tools/r2/Maintain-TaikoDiveR2.ps1 -Channel $channel | Tee-Object -FilePath "inventory/$channel.json"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-live-dryrun
          path: inventory/
          retention-days: 3
