name: Read-only R2 inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read R2 object and multipart inventory
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          mkdir inventory
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 --bucket taikodive --endpoint-url "$endpoint" --output json > inventory/objects.json
          aws s3api list-multipart-uploads --bucket taikodive --endpoint-url "$endpoint" --output json > inventory/multipart.json
          aws s3api get-bucket-lifecycle-configuration --bucket taikodive --endpoint-url "$endpoint" --output json > inventory/lifecycle.json 2> inventory/lifecycle-error.txt || true
          aws s3api list-buckets --endpoint-url "$endpoint" --output json > inventory/buckets.json 2> inventory/buckets-error.txt || true
          python - <<'PY'
          import json, os
          from collections import defaultdict
          with open('inventory/objects.json') as f:
              objects = json.load(f).get('Contents', [])
          totals = defaultdict(int)
          for obj in objects:
              totals[obj['Key'].split('/')[0]] += obj['Size']
          report = {'object_count': len(objects), 'bytes': sum(totals.values()), 'prefix_bytes': dict(totals)}
          with open('inventory/summary.json', 'w') as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Read-only inventory (no uploads/deletions):\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
      - name: Save read-only audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-readonly-inventory
          path: inventory/
          retention-days: 3
