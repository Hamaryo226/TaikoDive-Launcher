name: Publish TaikoDive Asset update

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - RELEASE_NOTES.md
      - .github/workflows/publish-assets-update.yml
  workflow_dispatch:

concurrency:
  group: publish-taikodive-assets-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout private Asset repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip --yes --no-progress

      # TaikoDive-Launcherはprivateなので、ツール取得用に読み取り専用のトークンを発行する。
      - name: Create token for packaging tools
        id: tools-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Hamaryo226
          repositories: TaikoDive-Launcher
          permission-contents: read

      - name: Checkout packaging tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hamaryo226/TaikoDive-Launcher
          token: ${{ steps.tools-token.outputs.token }}
          persist-credentials: false
          path: launcher-tools

      - name: Generate update version
        id: version
        shell: pwsh
        run: |
          $version = "0.$env:GITHUB_RUN_NUMBER.0"
          "value=$version" >> $env:GITHUB_OUTPUT
          "TaikoDive Asset update version: $version"

      - name: Create encrypted package from src
        shell: pwsh
        env:
          GAME_PACKAGE_KEY: ${{ secrets.GAME_PACKAGE_KEY }}
        run: |
          $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE 'RELEASE_NOTES.md'
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw 'RELEASE_NOTES.md is required.'
          }
          $releaseNotes = (Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw 'RELEASE_NOTES.md must not be empty.'
          }
          if ($releaseNotes.Length -gt 4000) {
            throw 'RELEASE_NOTES.md must be 4000 characters or fewer.'
          }

          if ([string]::IsNullOrWhiteSpace($env:GAME_PACKAGE_KEY)) {
            throw 'GAME_PACKAGE_KEY secret is required.'
          }
          & .\launcher-tools\tools\assets-update\New-TaikoDiveAssetsUpdate.ps1 `
            -SourceDirectory .\src `
            -Version '${{ steps.version.outputs.value }}' `
            -Revision $env:GITHUB_SHA `
            -ReleaseNotes $releaseNotes `
            -PackageKey $env:GAME_PACKAGE_KEY `
            -OutputDirectory .\assets-update

      - name: Publish stable Asset update to Cloudflare R2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          & .\launcher-tools\tools\r2\Publish-TaikoDiveR2.ps1 `
            -Channel assets `
            -PayloadPath (Get-Item .\assets-update\TaikoDive_Assets_*.zip).FullName `
            -ManifestPath .\assets-update\assets-update-manifest.json
