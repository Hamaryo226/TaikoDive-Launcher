name: Publish TaikoDive game update

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-taikodive-game-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout private TaikoDive source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip --yes --no-progress

      - name: Build TaikoDive
        shell: pwsh
        run: dotnet build TaikoDive.sln -c Release -p:Platform=x64

      # TaikoDive-Launcherはprivateなので、ツール取得用に読み取り専用のトークンを発行する。
      - name: Create token for packaging tools
        id: tools-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Hamaryo226
          repositories: TaikoDive-Launcher
          permission-contents: read

      - name: Checkout packaging tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hamaryo226/TaikoDive-Launcher
          token: ${{ steps.tools-token.outputs.token }}
          persist-credentials: false
          path: launcher-tools

      - name: Generate update version
        id: version
        shell: pwsh
        run: |
          $version = "0.$env:GITHUB_RUN_NUMBER.0"
          "value=$version" >> $env:GITHUB_OUTPUT
          "TaikoDive update version: $version"

      - name: Create encrypted package
        shell: pwsh
        env:
          GAME_PACKAGE_KEY: ${{ secrets.GAME_PACKAGE_KEY }}
        run: |
          $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE 'RELEASE_NOTES.md'
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw 'RELEASE_NOTES.md is required.'
          }
          $releaseNotes = (Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw 'RELEASE_NOTES.md must not be empty.'
          }
          if ($releaseNotes.Length -gt 4000) {
            throw 'RELEASE_NOTES.md must be 4000 characters or fewer.'
          }

          if ([string]::IsNullOrWhiteSpace($env:GAME_PACKAGE_KEY)) {
            throw 'GAME_PACKAGE_KEY secret is required.'
          }
          & .\launcher-tools\tools\game-update\New-TaikoDiveGameUpdate.ps1 `
            -BuildDirectory .\build `
            -Version '${{ steps.version.outputs.value }}' `
            -Revision $env:GITHUB_SHA `
            -ReleaseNotes $releaseNotes `
            -PackageKey $env:GAME_PACKAGE_KEY `
            -OutputDirectory .\game-update

      - name: Create token for public release repository
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Hamaryo226
          repositories: TaikoDive-Releases
          permission-contents: write

      - name: Publish stable game update
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          $repository = 'Hamaryo226/TaikoDive-Releases'
          $tag = 'game-stable'
          $package = Get-Item .\game-update\TaikoDive_Update_*.zip
          $manifest = Get-Item .\game-update\game-update-manifest.json

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repository `
              --title 'TaikoDive - stable' `
              --notes 'privateソースから生成されるTaikoDiveゲーム更新チャネルです。' `
              --target main
          }
          gh release upload $tag $package.FullName $manifest.FullName --clobber --repo $repository
